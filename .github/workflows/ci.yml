name: CI - Key Vault

on:
  push:
    branches:
      - main
    paths:
      - 'keyvault/data.json'
      - 'keyvault/config.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'keyvault/data.json'
      - 'keyvault/config.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prd
      dry-run:
        description: 'Only preview changes without creating secrets'
        required: true
        default: false
        type: boolean

concurrency:
  group: keyvault-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  update-keyvault:
    name: Update Azure Key Vault
    uses: Demo-PCB/dso-keyvault-reusable/.github/workflows/_ci-keyvault.yml@main
    with:
      environment: ${{ inputs.environment || 'dev' }}
      data-file-path: keyvault/data.json
      config-file-path: keyvault/config.yml
      initial-secret-value: DEMO
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit