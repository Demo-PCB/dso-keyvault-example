# =====================================================
# Caller Workflow: CI - Azure Key Vault
# =====================================================
# This is an example caller workflow for consuming repositories.
# Copy this file to your repository's .github/workflows/ directory.
#
# Triggers:
# - Automatically on push/PR to main when keyvault files change
# - Manual trigger via workflow_dispatch
#
# Prerequisites:
# - keyvault/data.json file with key-value configuration
# - keyvault/config.yml file with version and environment configs
# - Repository secrets configured (see README)
# =====================================================

name: CI - Key Vault

on:
  push:
    branches:
      - main
    paths:
      - 'keyvault/data.json'
      - 'keyvault/config.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'keyvault/data.json'
      - 'keyvault/config.yml'
  workflow_dispatch:

# Prevent concurrent CI runs on the same branch
concurrency:
  group: ci-keyvault-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: write
  security-events: write

jobs:
  ci:
    name: Build and Package
    # Reference format: {org}/{reusable-repo}/.github/workflows/{workflow-file}@{ref}
    uses: Demo-PCB/dso-keyvault-reusable/.github/workflows/_ci-keyvault.yml@main
    with:
      application: 'dso'
      component-name: 'dso-keyvault-example'
      
      # Optional: Path to data.json file (default: 'data.json')
      # data-file-path: 'config/data.json'
      
      # Optional: Path to config.yml file (default: 'config.yml')
      # config-file-path: 'config/config.yml'
      
      # Optional: Enable/disable schema validation (default: true)
      # FLAG_RUN_SCHEMA_VALIDATION: true
      
      # Optional: Enable/disable secret scanning (default: true)
      # FLAG_RUN_SECRET_SCAN: true
      
      # Optional: Enable/disable publishing to Artifactory (default: true)
      # FLAG_PUBLISH_ARTIFACTS: true
    secrets: inherit
